<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inscription</title>
</head>
<body>
    <header>
        <h1>Inscription au Club Informatique</h1><br>
    </header>
    <main>
        <form action="merci.html" method="get"><h3>Vos informations</h3>
            <p><label for="n">Nom</label><input type="text" id="n" name="n"></p>
            <p><label for="p">Prénom</label><input type="text" name="p" id="p"></p>
            <p><label for="ad">Adresse e-mail</label><input type="email" name="ad" id="ad"></p>
            <p><label for="t">télèphone</label><input type="tel" name="t" id="t"></p>
            <p><label for="mdp">Mot de passe</label><input type="password" name="mdp" id="mdp"></p>
            <p><label for="naiss">Date de naissance</label><input type="date" name="naiss" id="naiss"></p>
        </form>
    </main>
    <footer>
        <p>Club Informatique</p><br>
        <a href="index.html">Retour a l'acceuil</a>
    </footer>
</body>
</html>
